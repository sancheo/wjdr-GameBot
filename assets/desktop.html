<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; object-src 'none'; base-uri 'self'">
  <title>无尽冬日 GameBot</title>
  <link rel="stylesheet" href="desktop/app.css">
  <script src="desktop/bridge.js" defer></script>
  <script src="desktop/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="branding">
      <img src="gamebot-icon.png" alt="" class="logo">
      <div><h1>无尽冬日 GameBot</h1><p>自动任务控制台 · <span id="app-version">正在读取版本…</span></p></div>
      <button id="check-updates" class="refresh update-check" disabled>检查更新</button>
    </header>
    <section id="update-panel" class="panel update-panel" aria-label="软件更新">
      <p id="update-message" role="status">正在读取更新状态…</p>
      <progress id="update-progress" max="100" value="0" hidden aria-label="更新下载进度"></progress>
      <details id="update-details" hidden><summary>更新说明</summary><p id="update-notes"></p></details>
      <button id="update-action" class="refresh" hidden>下载更新</button>
    </section>
    <section class="panel device-panel" aria-label="模拟器与运行控制">
      <img src="ui/monitor.png" alt="" class="device-icon">
      <div class="device-group">
        <label class="field-title" for="device">模拟器</label>
        <div class="device-row">
          <div class="device-picker">
            <button id="device" class="device-trigger" disabled aria-label="选择模拟器" aria-haspopup="dialog" aria-expanded="false" aria-controls="device-list"><span id="device-label">请选择模拟器</span><span aria-hidden="true">▾</span></button>
            <div id="device-list" class="device-list" role="dialog" aria-label="模拟器列表" hidden></div>
          </div>
          <button id="refresh" class="refresh" disabled><img src="ui/refresh.png" alt="">刷新</button>
        </div>
        <p id="device-status" class="device-status" role="status">正在查找模拟器…</p>
      </div>
      <div class="device-divider"></div>
      <div class="action-group">
        <span id="run-status" class="run-status">● 未运行</span>
        <button id="run" class="run-button" disabled><span class="play">▶</span><span id="run-label">启动</span></button>
      </div>
    </section>
    <div class="section-heading">
      <div><img src="ui/gear.png" alt=""><h2>自动任务</h2></div>
      <span><img src="ui/clock.png" alt="">到期自动检查，重连后立即复查</span>
    </div>
    <section class="cards" aria-label="自动任务设置">
      <article id="alt-account" class="panel task-card"><h3><img src="ui/trumpet.svg" alt="">小号模式</h3><div class="card-fields"></div></article>
      <article id="daily" class="panel task-card"><h3><img src="ui/calendar.png" alt="">日常任务</h3><div class="card-fields"></div></article>
      <article id="training" class="panel task-card"><h3><img src="ui/people.png" alt="">练兵任务</h3><div class="card-fields"></div></article>
      <article id="connection" class="panel task-card"><h3><img src="ui/diamond.png" alt="">结晶与连接</h3><div class="card-fields"></div></article>
      <article id="wilderness" class="panel task-card"><h3><img src="ui/intelligence.png" alt="">野外任务</h3><div class="card-fields"></div></article>
    </section>
    <section class="panel task-status-panel" aria-label="任务执行状态">
      <div class="log-heading"><h2><img src="ui/clock.png" alt="">任务执行状态</h2><span>停用的任务可单独重试</span></div>
      <p id="task-status-empty" class="task-status-empty">启动后显示当前任务、下次执行时间和停用原因</p>
      <div id="task-status-rows" class="task-status-rows"></div>
    </section>
    <section class="panel log-panel" aria-label="运行日志">
      <div class="log-heading"><h2><img src="ui/terminal.png" alt="">运行日志</h2><span>异常结束时会弹窗提示</span></div>
      <div id="errors" class="error-area" hidden><h3>异常信息</h3><div id="error-lines" class="log-lines" tabindex="0" aria-label="异常信息"></div></div>
      <div class="normal-log">
        <div id="empty-log" class="empty-log"><img src="ui/document.png" alt=""><strong>暂无日志</strong><span>启动后将在这里显示运行记录</span></div>
        <div id="log-lines" class="log-lines" tabindex="0" aria-label="运行日志" hidden></div>
      </div>
    </section>
  </main>
  <dialog id="notice"><h2 id="notice-title">提示</h2><p id="notice-message"></p><form method="dialog"><button autofocus>确定</button></form></dialog>
  <dialog id="help-clicker-confirm" aria-labelledby="help-clicker-confirm-title" aria-describedby="help-clicker-confirm-message"><h2 id="help-clicker-confirm-title">互助连点</h2><p id="help-clicker-confirm-message">打开时其他功能不会执行, 只会进入联盟互助界面快速点击互助</p><form method="dialog"><button class="secondary" value="no" autofocus>否</button><button value="yes">是</button></form></dialog>
</body>
</html>
